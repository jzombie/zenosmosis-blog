{{ $caption := or .Title .Text }}
{{ $img := "" }}
{{ if not (or (hasPrefix .Destination "http://") (hasPrefix .Destination "https://") (hasPrefix .Destination "/")) }}
  {{ with .Page.Resources.GetMatch .Destination }}{{ $img = . }}{{ end }}
{{ end }}
<figure class="post__figure">
  {{ if $img }}
    {{ $small := $img.Resize "800x" }}
    {{ $medium := $img.Resize "1200x" }}
    {{ $large := $img.Resize "1600x" }}
    <a href="{{ $large.RelPermalink }}" target="_blank" rel="noopener">
      <img src="{{ $medium.RelPermalink }}" srcset="{{ $small.RelPermalink }} 800w, {{ $medium.RelPermalink }} 1200w, {{ $large.RelPermalink }} 1600w" sizes="(max-width: 800px) 100vw, 800px" alt="{{ .Text }}"{{ with .Title }} title="{{ . }}"{{ end }} loading="lazy" decoding="async" />
    </a>
  {{ else }}
    <a href="{{ .Destination | safeURL }}" target="_blank" rel="noopener">
      <img src="{{ .Destination | safeURL }}" alt="{{ .Text }}"{{ with .Title }} title="{{ . }}"{{ end }} loading="lazy" decoding="async" />
    </a>
  {{ end }}
  {{ if $caption }}
  <figcaption>{{ $caption }}</figcaption>
  {{ end }}
</figure>
